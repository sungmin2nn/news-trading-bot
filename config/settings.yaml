# 뉴스 이슈 브리핑 파라미터 (시크릿 아님 — 시크릿은 .env / GitHub Secrets)

sources:
  naver_main_pages: 3        # 네이버 금융 메인뉴스 수집 페이지 수

caps:
  max_articles: 40           # Gemini 입력 기사 상한 (토큰 통제)
  max_topics: 8              # 출력 주제 상한
  max_article_title_len: 120 # 기사 제목 절단 길이

gemini:
  model: gemini-2.5-flash    # 무료 티어, 환경변수 GEMINI_MODEL로 override 가능
  max_output_tokens: 8192    # 8주제×(요약+토론3+종합)이 잘리지 않도록 여유

telegram:
  max_message_len: 3800      # 텔레그램 4096자 제한 여유
