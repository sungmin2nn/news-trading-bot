# 트레이딩 봇 설정
# 5가지 전략 (A, B, C, C+, D) 비교 테스트

# ===================
# 공통 필터 (A, B, C, C+, D 전략 모두 적용)
# ===================

# 시가총액 필터 (원)
min_market_cap: 50000000000      # 최소: 500억
max_market_cap: 10000000000000   # 최대: 10조

# 거래량 필터
min_avg_volume: 100000           # 최소 평균 거래량: 10만주

# 키워드 점수 필터
min_score: 1                     # 최소 점수 (1점 이상)


# ===================
# B 전략 전용 필터 (고급 로직)
# ===================

# 급등주 제외
max_price_change_5d: 15.0        # 5일 수익률 상한: 15%

# 52주 고가 필터
max_52week_high_ratio: 90.0      # 52주 고가 대비 비율 상한: 90%

# 수급 필터
min_foreign_ratio: 1.0           # 최소 외국인 보유 비율: 1%

# 계약 공시 필터
min_contract_market_cap_ratio: 0.5  # 계약금액/시총 비율: 0.5%


# ===================
# C 전략 전용 필터 (기술적 분석)
# ===================

# RSI 필터
max_rsi: 75                        # RSI 상한 (과매수 제외) - 70→75 완화
min_rsi: 15                        # RSI 하한 (극단적 과매도 제외) - 20→15 완화

# 이동평균선 필터
require_golden_cross: false        # 골든크로스 선택사항 (true→false 완화)

# 외국인 수급 필터
min_foreign_consecutive_days: 0    # 외국인 연속 순매수 조건 제거 (3→0)


# ===================
# C+ 전략 전용 필터 (C 강화 - 거래량/볼린저 추가)
# ===================

# 거래량 모멘텀 필터 (cis식)
min_volume_ratio: 120              # 5일 평균 거래량 대비 비율: 120% (150→120 완화)

# 볼린저밴드 위치 필터
min_bb_position: 10                # 볼린저밴드 최소 위치: 10% (20→10 완화)
max_bb_position: 90                # 볼린저밴드 최대 위치: 90% (80→90 완화)


# ===================
# D 전략 전용 필터 (BNF/cis 하이브리드)
# ===================

# 25일 이동평균선 괴리율 필터 (BNF식)
min_ma25_divergence: -5            # 괴리율 하한: -5% (급락 제외)
max_ma25_divergence: 15            # 괴리율 상한: +15% (급등 제외)

# 양봉 필터 (cis식 - 오르는 주식 매수)
require_bullish_candle: true       # 전일 양봉 필수

# 거래량 필터 (cis식)
d_min_volume_ratio: 120            # D전략 최소 거래량 비율: 120%


# ===================
# 거래 비용 설정 (시뮬레이션용)
# ===================

# 실제 비용 반영 여부 (토글)
apply_trading_costs: true        # true: 수수료/슬리피지 반영, false: 미반영 (기존 방식)

# 매수 비용
buy_commission: 0.015            # 매수 수수료: 0.015% (증권사 평균)
buy_slippage: 0.1                # 매수 슬리피지: 0.1% (시가 매수 가정)

# 매도 비용
sell_commission: 0.015           # 매도 수수료: 0.015%
sell_slippage: 0.1               # 매도 슬리피지: 0.1% (종가 매도 가정)
sell_tax: 0.23                   # 증권거래세: 0.23%

# 총 예상 비용: 약 0.47% (왕복)
# - 매수: 0.015% + 0.1% = 0.115%
# - 매도: 0.015% + 0.1% + 0.23% = 0.345%
# - 합계: 0.46%


# ===================
# 결과 제한
# ===================

max_stocks: 10                   # 최대 선정 종목 수


# ===================
# 데이터 수집 설정
# ===================

# 뉴스 수집
news_max_pages: 10               # 네이버 뉴스 최대 페이지
news_delay: 0.5                  # 요청 간 딜레이 (초)

# 주가 데이터
price_lookback_days: 30          # 주가 조회 기간 (일)


# ===================
# 실행 시간 (KST)
# ===================

morning_scan_time: "08:30"       # 아침 스캔 시간
evening_track_time: "15:40"      # 저녁 추적 시간


# ===================
# 알림 설정 (선택사항)
# ===================

# slack_webhook_url: ""          # Slack 웹훅 URL (선택)
# telegram_bot_token: ""         # 텔레그램 봇 토큰 (선택)
# telegram_chat_id: ""           # 텔레그램 채팅 ID (선택)
