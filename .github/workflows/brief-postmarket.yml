name: Postmarket Brief

on:
  schedule:
    # 매일 18:00 KST (= UTC 09:00). 거래일=장후, 주말·휴장일=저녁 라벨.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '휴장일/주말에도 강제 실행 (테스트용)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Score matured predictions (P3 알파 채점)
        run: python -m src.score.alpha_scorer

      - name: Run postmarket brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS="--mode post"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m src.main_brief $ARGS

      - name: Persist sent state
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/sent_topics.json data/predictions.jsonl data/scores.jsonl || true
          git diff --staged --quiet || git commit -m "state: postmarket $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main || true
          git push || true
