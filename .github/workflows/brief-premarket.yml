name: Premarket Brief

on:
  schedule:
    # 08:00 KST 화~월 (= UTC 23:00 월~금 전일). 한국 거래일 아침 장전.
    - cron: '0 23 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run premarket brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main_brief --mode pre

      - name: Persist sent state
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/sent_topics.json || true
          git diff --staged --quiet || git commit -m "state: premarket $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main || true
          git push || true
